[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nirantar"
version = "0.1.0"
description = "NIRANTAR: National Intelligent Readiness & Airworthiness Network for Total Asset Reliability (Milestone 1 engine)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["nirantar*"]

[tool.setuptools.package-data]
"nirantar.ui" = ["static/*"]
"nirantar.setu" = ["mappings/*.json"]
"nirantar.pariksha" = ["datasets/*"]
"nirantar.saarthi" = ["data/lycoming/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
